server:
  port: 8084
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  hsts:
    enabled: false

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: interview-master-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mock_interview?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 300000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      maximum-pool-size: 30
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:}
      port: 6379
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
    
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          from: ${MAIL_FROM:}
          ssl:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-log: false
  timeout: 86400
  active-timeout: 3600
  # 会话统一写入 Redis，双实例/蓝绿切换下共享登录态
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-body: false

deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-v4-flash
  request-timeout-ms: 120000
  request-retry: 0

zhipu:
  base-url: https://open.bigmodel.cn/api/paas/v4
  api-key: ${ZHIPU_API_KEY:}
  model: glm-4.7-flashx
  request-timeout-ms: 120000
  request-retry: 1

trtc:
  sdk-app-id: ${TRTC_SDK_APP_ID:0}
  secret-key: ${TRTC_SECRET_KEY:}
  user-sig-expire-seconds: 7200
